name: Deploy download page

# Publishes docs/ to GitHub Pages so
# https://cambric-software.github.io/Max-Tools/ serves the download page.
#
# One-time setup (repository settings -> Pages): set Source to
# "GitHub Actions". After that this workflow keeps it deployed.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once; queue instead of cancelling so a deploy
# is never left half-finished.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify the download page exists
        run: test -f docs/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
