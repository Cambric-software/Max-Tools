name: max_tools
description: Max Tools - an all-in-one toolkit for developers, animators, freelancers and business users.
publish_to: "none"
version: 0.2.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cambric_design:
    git:
      url: https://github.com/Cambric-software/app-template.git
      path: packages/cambric_design
  cupertino_icons: ^1.0.8
  path_provider: ^2.1.4
  shared_preferences: ^2.5.3
  http: ^1.2.2
  crypto: ^3.0.6
  logging: ^1.3.0
  archive: ^4.5.2
  cryptography: ^2.9.0
  image: ^4.12.0
  pdf: ^3.13.1
  zxing2: ^0.2.4
  barcode_widget: ^2.0.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
